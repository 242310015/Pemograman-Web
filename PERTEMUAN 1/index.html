<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Programming Language Career</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            border: 1px dashed #000;
            padding: 20px;
        }
        h2 { margin-top: 30px; }

        /* Container untuk layout 3 kolom */
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            text-align: center;
        }

        /* Kotak judul kategori */
        .category-box {
            border: 2px solid #0056b3;
            padding: 10px;
            width: 180px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* List bahasa pemrograman */
        .lang-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .lang-item img {
            width: 30px;
            margin-right: 15px;
        }

        /* Styling untuk Iframe area */
        .iframe-placeholder {
            background-color: #ccc;
            border: 1px solid #000;
            padding: 15px;
            text-align: center;
            font-style: italic;
        }

        .wiki-image {
            width: 100%;
            border: 1px solid #000;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Programming Language Base on Career</h2>

    <div class="flex-container">
        <div>
            <div class="category-box">Front-end Web Development</div>
            <div class="lang-item"><img src="js-icon.png" alt="JS"> JavaScript</div>
            <div class="lang-item"><img src="elm-icon.png" alt="Elm"> Elm</div>
            <div class="lang-item"><img src="ts-icon.png" alt="TS"> TypeScript</div>
        </div>

        <div>
            <div class="category-box">Back-end Web Development</div>
            <div class="lang-item"><img src="js-icon.png" alt="JS"> JavaScript</div>
            <div class="lang-item"><img src="scala-icon.png" alt="Scala"> Scala</div>
            <div class="lang-item"><img src="go-icon.png" alt="Go"> Go</div>
            <div class="lang-item"><img src="ruby-icon.png" alt="Ruby"> Ruby</div>
            <div class="lang-item"><img src="python-icon.png" alt="Python"> Python</div>
        </div>

        <div>
            <div class="category-box">Mobile Development</div>
            <div class="lang-item"><img src="js-icon.png" alt="JS"> JavaScript</div>
            <div class="lang-item"><img src="java-icon.png" alt="Java"> Java</div>
            <div class="lang-item"><img src="objc-icon.png" alt="ObjC"> Objective C</div>
            <div class="lang-item"><img src="swift-icon.png" alt="Swift"> Swift</div>
        </div>
    </div>

    <h2>Top 10 Programming Language in 2022</h2>
    <div class="iframe-placeholder">
        <iframe src="Latihan-4.html" width="100%" height="50px" frameborder="0">
            ...Iframe to Latihan-4...
        </iframe>
    </div>

    <h2>List of programming languages from Wikipedia</h2>
    <img src="wikipedia-screenshot.png" alt="Wikipedia Page" class="wiki-image">

</body>
</html>
